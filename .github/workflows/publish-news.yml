name: AIO Digital video publisher
on:
  schedule:
    - cron: "0,30 12-23 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish next queued video
        run: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "https://aio-dijital.vercel.app/api/news/publish"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
